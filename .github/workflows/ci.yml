name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTASKS_TEST_MONGO_URI: mongodb://localhost:27017
      GOTASKS_SCENARIO_DURATION: 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build (library + examples)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit + integration tests (race)
        run: go test ./... -race -short -count=1 -timeout 10m

      - name: Scenario soak tests (30s each, parallel)
        run: go test . -run TestScenario -count=1 -timeout 15m -v
